services:
  api:
    build: .
    image: astm-audit-api:latest
    ports:
      # 宿主机端口通过环境变量 ASTM_HOST_PORT 配置，默认 8000
      - "${ASTM_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  verify:
    build: .
    image: astm-audit-api:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
    entrypoint: ["/bin/sh", "/app/scripts/verify.sh"]
    restart: "no"
